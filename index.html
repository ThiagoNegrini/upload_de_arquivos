<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Envio de Documentos</title>


    <style>

        * {
            box-sizing: border-box;
        }


        /* ==========================================
           FUNDO PRINCIPAL COM DEGRADÊ
        =========================================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            margin: 0;

            padding: 30px;

            background:
                linear-gradient(
                    135deg,
                    #071a52 0%,
                    #0b3d91 35%,
                    #1677c8 68%,
                    #20c4d9 100%
                );

            background-attachment: fixed;

            position: relative;

            overflow-x: hidden;

        }


        /* ==========================================
           EFEITOS DECORATIVOS DO FUNDO
        =========================================== */

        body::before {

            content: "";

            position: fixed;

            width: 420px;

            height: 420px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.08);

            top: -180px;

            left: -150px;

            filter: blur(5px);

            pointer-events: none;

        }


        body::after {

            content: "";

            position: fixed;

            width: 500px;

            height: 500px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.07);

            bottom: -240px;

            right: -180px;

            filter: blur(5px);

            pointer-events: none;

        }


        /* ==========================================
           CONTAINER
        =========================================== */

        .container {

            display: flex;

            flex-direction: row;

            align-items: center;

            justify-content: center;

            gap: 55px;

            max-width: 1000px;

            width: 100%;

            position: relative;

            z-index: 2;

        }


        /* ==========================================
           ÁREA DO LOGO
        =========================================== */

        .logo-area {

            flex: 1;

            text-align: center;

            max-width: 340px;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .logo-area img {

            max-width: 100%;

            height: auto;

            object-fit: contain;

            padding: 18px;

            background:
                rgba(255, 255, 255, 0.96);

            border:
                1px solid rgba(255, 255, 255, 0.70);

            border-radius: 22px;

            box-shadow:

                0 20px 45px
                rgba(0, 0, 0, 0.22),

                0 5px 15px
                rgba(0, 0, 0, 0.12);

            box-sizing: border-box;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;

        }


        .logo-area img:hover {

            transform:
                translateY(-5px)
                scale(1.01);

            border-color:
                rgba(255, 255, 255, 0.95);

            box-shadow:

                0 25px 55px
                rgba(0, 0, 0, 0.27),

                0 8px 18px
                rgba(0, 0, 0, 0.15);

        }


        /* ==========================================
           CARTÕES
        =========================================== */

        .card {

            background:
                rgba(255, 255, 255, 0.97);

            padding: 34px;

            border-radius: 22px;

            box-shadow:

                0 25px 60px
                rgba(0, 0, 0, 0.22),

                0 8px 20px
                rgba(0, 0, 0, 0.10);

            width: 100%;

            max-width: 390px;

            text-align: center;

            border:
                1px solid
                rgba(255, 255, 255, 0.75);

            position: relative;

            overflow: hidden;

            animation:
                aparecerCard 0.45s ease;

        }


        /* Linha superior degradê */

        .card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #071a52,
                    #0b3d91,
                    #1677c8,
                    #20c4d9
                );

        }


        @keyframes aparecerCard {

            from {

                opacity: 0;

                transform:
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* ==========================================
           TÍTULOS
        =========================================== */

        h2 {

            margin-top: 0;

            margin-bottom: 12px;

            font-size: 23px;

            font-weight: 800;

            letter-spacing: 0.3px;

            background:
                linear-gradient(
                    90deg,
                    #071a52,
                    #0b3d91,
                    #1677c8
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color:
                transparent;

            background-clip: text;

        }


        p {

            color: #667085;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 24px;

        }


        p strong {

            color: #0b3d91;

        }


        /* ==========================================
           FORMULÁRIOS
        =========================================== */

        .form-group {

            text-align: left;

            margin-bottom: 17px;

        }


        label {

            font-size: 13px;

            color: #344054;

            font-weight: 700;

            display: block;

            margin-bottom: 7px;

        }


        input[type="text"],
        input[type="password"] {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #d0d5dd;

            border-radius: 10px;

            box-sizing: border-box;

            font-size: 15px;

            background-color: #ffffff;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;

        }


        input[type="text"]:focus,
        input[type="password"]:focus {

            border-color:
                #1677c8;

            box-shadow:
                0 0 0 4px
                rgba(22, 119, 200, 0.12);

            transform:
                translateY(-1px);

        }


        input::placeholder {

            color: #98a2b3;

        }


        /* ==========================================
           CAMPO DE ARQUIVO
        =========================================== */

        input[type="file"] {

            margin: 12px 0 18px;

            width: 100%;

            padding: 11px;

            box-sizing: border-box;

            font-size: 13px;

            color: #475467;

            background:
                #f8fafc;

            border:
                1px dashed #b8c7d9;

            border-radius: 10px;

            cursor: pointer;

        }


        input[type="file"]:hover {

            border-color:
                #1677c8;

            background:
                #f1f8ff;

        }


        /* ==========================================
           BOTÕES
        =========================================== */

        button {

            background:
                linear-gradient(
                    135deg,
                    #071a52 0%,
                    #0b3d91 40%,
                    #1677c8 75%,
                    #20c4d9 100%
                );

            color: white;

            border: none;

            padding: 13px 16px;

            border-radius: 10px;

            cursor: pointer;

            width: 100%;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 0.2px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;

            margin-bottom: 10px;

            box-shadow:
                0 7px 18px
                rgba(11, 61, 145, 0.25);

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 11px 25px
                rgba(11, 61, 145, 0.32);

        }


        button:active {

            transform:
                translateY(0);

        }


        button:disabled {

            background:
                linear-gradient(
                    135deg,
                    #98a2b3,
                    #c0c7d0
                );

            cursor: not-allowed;

            box-shadow: none;

            transform: none;

        }


        /* ==========================================
           BOTÃO SECUNDÁRIO
        =========================================== */

        .btn-secundario {

            background:
                linear-gradient(
                    135deg,
                    #475467,
                    #667085
                );

        }


        .btn-secundario:hover {

            background:
                linear-gradient(
                    135deg,
                    #344054,
                    #475467
                );

        }


        /* ==========================================
           BOTÃO LOGOUT
        =========================================== */

        .btn-logout {

            background:
                linear-gradient(
                    135deg,
                    #b42318,
                    #d92d20
                );

            font-size: 12px;

            padding:
                8px 14px;

            width: auto;

            margin-top: 18px;

            margin-bottom: 0;

            box-shadow:
                0 5px 12px
                rgba(217, 45, 32, 0.20);

        }


        .btn-logout:hover {

            background:
                linear-gradient(
                    135deg,
                    #912018,
                    #b42318
                );

        }


        /* ==========================================
           MENSAGENS DE STATUS
        =========================================== */

        .status-msg {

            margin-top: 15px;

            min-height: 20px;

            font-size: 13px;

            font-weight: 600;

            line-height: 1.5;

        }


        /* ==========================================
           LINKS
        =========================================== */

        .link {

            color:
                #0b5cad;

            cursor: pointer;

            font-size: 13px;

            margin-top: 14px;

            display: block;

            font-weight: 600;

            transition:
                color 0.2s ease;

        }


        .link:hover {

            color:
                #20a8c7;

            text-decoration: none;

        }


        /* ==========================================
           OCULTAR
        =========================================== */

        .hidden {

            display: none;

        }


        /* ==========================================
           RESPONSIVIDADE
        =========================================== */

        @media (max-width: 768px) {

            body {

                padding: 20px;

            }


            .container {

                flex-direction: column;

                gap: 25px;

            }


            .logo-area {

                max-width: 220px;

            }


            .logo-area img {

                padding: 14px;

                border-radius: 18px;

            }


            .card {

                max-width: 420px;

                padding: 28px 22px;

                border-radius: 18px;

            }

        }


        @media (max-width: 480px) {

            body {

                padding: 15px;

            }


            .logo-area {

                max-width: 180px;

            }


            .card {

                padding: 26px 18px;

            }


            h2 {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==========================================
         LOGO
    =========================================== -->

    <div class="logo-area">

        <img
            src="https://github.com/ThiagoNegrini/upload_de_arquivos/blob/main/LOGO_SITE.PNG?raw=true"
            alt="Logotipo da Empresa"
            id="imgLogo"
        >

    </div>


    <!-- ==========================================
         LOGIN
    =========================================== -->

    <div
        class="card"
        id="telaLogin"
    >

        <h2>
            ACESSO AO PAINEL DE ENVIO
        </h2>


        <p>
            Entre com seu usuário e senha.
        </p>


        <div class="form-group">

            <label for="loginUsuario">
                Usuário:
            </label>

            <input
                type="text"
                id="loginUsuario"
                placeholder="Digite seu usuário"
            >

        </div>


        <div class="form-group">

            <label for="loginSenha">
                Senha:
            </label>

            <input
                type="password"
                id="loginSenha"
                placeholder="Digite sua senha"
            >

        </div>


        <button
            id="btnLogin"
            onclick="efetuarLogin()"
        >
            Entrar
        </button>


        <div
            id="loginStatus"
            class="status-msg"
        ></div>


        <span
            class="link"
            onclick="mostrarCadastro()"
        >
            Ainda não possui cadastro? Criar conta
        </span>

    </div>


    <!-- ==========================================
         CADASTRO
    =========================================== -->

    <div
        class="card hidden"
        id="telaCadastro"
    >

        <h2>
            CRIAR CADASTRO
        </h2>


        <p>
            Preencha seus dados para criar seu acesso.
        </p>


        <div class="form-group">

            <label for="cadastroNome">
                Nome:
            </label>

            <input
                type="text"
                id="cadastroNome"
                placeholder="Seu nome"
            >

        </div>


        <div class="form-group">

            <label for="cadastroUsuario">
                Usuário:
            </label>

            <input
                type="text"
                id="cadastroUsuario"
                placeholder="Escolha um usuário"
            >

        </div>


        <div class="form-group">

            <label for="cadastroSenha">
                Senha:
            </label>

            <input
                type="password"
                id="cadastroSenha"
                placeholder="Mínimo de 6 caracteres"
            >

        </div>


        <button
            id="btnCadastro"
            onclick="cadastrarUsuario()"
        >
            Criar Cadastro
        </button>


        <div
            id="cadastroStatus"
            class="status-msg"
        ></div>


        <span
            class="link"
            onclick="mostrarLogin()"
        >
            Já possui cadastro? Entrar
        </span>

    </div>


    <!-- ==========================================
         UPLOAD
    =========================================== -->

    <div
        class="card hidden"
        id="telaUpload"
    >

        <h2>
            SISTEMA DE ENVIO
        </h2>


        <p>

            Olá,
            <strong id="nomeUsuarioLogado"></strong>!

            <br>

            DOCUMENTAÇÃO CARNAVAL 2027

        </p>


        <!-- NOME DA PASTA -->

        <div class="form-group">

            <label for="nomePasta">
                Nome da Pasta:
            </label>

            <input
                type="text"
                id="nomePasta"
                placeholder="Ex: Escola de Samba Unidos"
            >

        </div>


        <!-- NOME DO ARQUIVO -->

        <div class="form-group">

            <label for="nomeArquivoCustom">
                Nome do Arquivo / Identificação:
            </label>

            <input
                type="text"
                id="nomeArquivoCustom"
                placeholder="Ex: Escola_Samba_Oficio_01"
            >

        </div>


        <!-- ARQUIVO -->

        <input
            type="file"
            id="arquivoInput"
        >


        <!-- BOTÃO ENVIAR -->

        <button
            id="btnEnviar"
            onclick="enviarArquivo()"
        >
            Enviar Arquivo
        </button>


        <!-- STATUS -->

        <div
            id="status"
            class="status-msg"
        ></div>


        <!-- LOGOUT -->

        <button
            class="btn-logout"
            onclick="efetuarLogout()"
        >
            Sair da Conta
        </button>

    </div>

</div>


<script>


// ==========================================
// CONFIGURAÇÃO
// ==========================================

const URL_SCRIPT =
    'https://script.google.com/macros/s/AKfycbztOK3_JuX4AsIP1sXft-TpDCvQch6g106rZ1vMHVO2jPp3c_C-KXDMV2QiBpYRpACNrg/exec';


// Usuário atualmente logado

let usuarioLogado = '';


// ==========================================
// MOSTRAR LOGIN
// ==========================================

function mostrarLogin() {

    document
        .getElementById('telaCadastro')
        .classList.add('hidden');

    document
        .getElementById('telaLogin')
        .classList.remove('hidden');

}


// ==========================================
// MOSTRAR CADASTRO
// ==========================================

function mostrarCadastro() {

    document
        .getElementById('telaLogin')
        .classList.add('hidden');

    document
        .getElementById('telaCadastro')
        .classList.remove('hidden');

}


// ==========================================
// CADASTRO
// ==========================================

async function cadastrarUsuario() {

    const nome =
        document
            .getElementById('cadastroNome')
            .value
            .trim();


    const usuario =
        document
            .getElementById('cadastroUsuario')
            .value
            .trim();


    const senha =
        document
            .getElementById('cadastroSenha')
            .value
            .trim();


    const status =
        document.getElementById('cadastroStatus');


    const botao =
        document.getElementById('btnCadastro');


    if (!nome || !usuario || !senha) {

        status.innerHTML =
            '⚠️ Preencha todos os campos.';

        status.style.color =
            '#d93025';

        return;

    }


    if (senha.length < 6) {

        status.innerHTML =
            '⚠️ A senha deve possuir pelo menos 6 caracteres.';

        status.style.color =
            '#d93025';

        return;

    }


    botao.disabled = true;

    status.innerHTML =
        '⏳ Criando cadastro...';

    status.style.color =
        '#1677c8';


    try {

        const parametros =
            new URLSearchParams({

                acao: 'cadastro',

                nome: nome,

                usuario: usuario,

                senha: senha

            });


        const resposta =
            await fetch(

                URL_SCRIPT,

                {

                    method: 'POST',

                    mode: 'cors',

                    body: parametros

                }

            );


        const resultado =
            await resposta.json();


        if (resultado.sucesso) {

            status.innerHTML =
                '✅ Cadastro realizado com sucesso!';

            status.style.color =
                '#188038';


            document
                .getElementById('cadastroNome')
                .value = '';


            document
                .getElementById('cadastroUsuario')
                .value = '';


            document
                .getElementById('cadastroSenha')
                .value = '';


            setTimeout(

                mostrarLogin,

                1500

            );

        } else {

            status.innerHTML =
                '❌ ' + resultado.mensagem;

            status.style.color =
                '#d93025';

        }

    } catch (erro) {

        console.error(erro);

        status.innerHTML =
            '❌ Erro de comunicação com o servidor.';

        status.style.color =
            '#d93025';

    } finally {

        botao.disabled = false;

    }

}


// ==========================================
// LOGIN
// ==========================================

async function efetuarLogin() {

    const usuario =
        document
            .getElementById('loginUsuario')
            .value
            .trim();


    const senha =
        document
            .getElementById('loginSenha')
            .value
            .trim();


    const status =
        document.getElementById('loginStatus');


    const botao =
        document.getElementById('btnLogin');


    if (!usuario || !senha) {

        status.innerHTML =
            '⚠️ Informe usuário e senha.';

        status.style.color =
            '#d93025';

        return;

    }


    botao.disabled = true;

    status.innerHTML =
        '⏳ Verificando acesso...';

    status.style.color =
        '#1677c8';


    try {

        const parametros =
            new URLSearchParams({

                acao: 'login',

                usuario: usuario,

                senha: senha

            });


        const resposta =
            await fetch(

                URL_SCRIPT,

                {

                    method: 'POST',

                    mode: 'cors',

                    body: parametros

                }

            );


        const resultado =
            await resposta.json();


        if (resultado.sucesso) {

            usuarioLogado =
                resultado.usuario;


            document
                .getElementById('nomeUsuarioLogado')
                .innerText =
                resultado.nome ||
                resultado.usuario;


            document
                .getElementById('telaLogin')
                .classList.add('hidden');


            document
                .getElementById('telaUpload')
                .classList.remove('hidden');


            document
                .getElementById('loginUsuario')
                .value = '';


            document
                .getElementById('loginSenha')
                .value = '';


            status.innerHTML = '';

        } else {

            status.innerHTML =
                '❌ ' + resultado.mensagem;

            status.style.color =
                '#d93025';

        }

    } catch (erro) {

        console.error(erro);

        status.innerHTML =
            '❌ Erro de comunicação com o servidor.';

        status.style.color =
            '#d93025';

    } finally {

        botao.disabled = false;

    }

}


// ==========================================
// LOGOUT
// ==========================================

function efetuarLogout() {

    usuarioLogado = '';


    document
        .getElementById('telaUpload')
        .classList.add('hidden');


    document
        .getElementById('telaLogin')
        .classList.remove('hidden');


    document
        .getElementById('status')
        .innerHTML = '';


    document
        .getElementById('arquivoInput')
        .value = '';


    document
        .getElementById('nomeArquivoCustom')
        .value = '';


    document
        .getElementById('nomePasta')
        .value = '';

}


// ==========================================
// UPLOAD
// ==========================================

function enviarArquivo() {

    const input =
        document.getElementById('arquivoInput');


    const status =
        document.getElementById('status');


    const botao =
        document.getElementById('btnEnviar');


    const nomePastaInput =
        document
            .getElementById('nomePasta')
            .value
            .trim();


    const nomeCustomInput =
        document
            .getElementById('nomeArquivoCustom')
            .value
            .trim();


    // ------------------------------------------
    // VALIDAR LOGIN
    // ------------------------------------------

    if (!usuarioLogado) {

        status.innerHTML =
            '❌ Sessão expirada. Faça login novamente.';

        status.style.color =
            '#d93025';

        return;

    }


    // ------------------------------------------
    // VALIDAR PASTA
    // ------------------------------------------

    if (!nomePastaInput) {

        status.innerHTML =
            '⚠️ Informe o nome da pasta.';

        status.style.color =
            '#d93025';

        document
            .getElementById('nomePasta')
            .focus();

        return;

    }


    // ------------------------------------------
    // VALIDAR ARQUIVO
    // ------------------------------------------

    if (input.files.length === 0) {

        status.innerHTML =
            '⚠️ Por favor, selecione um arquivo primeiro.';

        status.style.color =
            '#d93025';

        return;

    }


    const arquivo =
        input.files[0];


    botao.disabled = true;


    status.innerHTML =
        '⏳ Enviando arquivo, por favor aguarde...';


    status.style.color =
        '#1677c8';


    const leitor =
        new FileReader();


    leitor.readAsDataURL(arquivo);


    leitor.onload = async function() {

        try {

            const dadosBase64 =
                leitor.result.split(',')[1];


            // --------------------------------------
            // DEFINIR NOME FINAL DO ARQUIVO
            // --------------------------------------

            let nomeFinalArquivo =
                arquivo.name;


            if (nomeCustomInput !== '') {

                const partes =
                    arquivo.name.split('.');


                const ext =
                    partes.length > 1
                        ? partes.pop()
                        : '';


                nomeFinalArquivo =
                    nomeCustomInput +
                    (ext ? '.' + ext : '');

            }


            // --------------------------------------
            // PREPARAR DADOS
            // --------------------------------------

            const parametros =
                new URLSearchParams({

                    acao: 'upload',

                    usuario:
                        usuarioLogado,

                    pasta:
                        nomePastaInput,

                    data:
                        dadosBase64,

                    mimeType:
                        arquivo.type,

                    filename:
                        nomeFinalArquivo

                });


            // --------------------------------------
            // ENVIAR PARA GOOGLE APPS SCRIPT
            // --------------------------------------

            const resposta =
                await fetch(

                    URL_SCRIPT,

                    {

                        method: 'POST',

                        mode: 'cors',

                        body: parametros

                    }

                );


            const resultado =
                await resposta.json();


            // --------------------------------------
            // SUCESSO
            // --------------------------------------

            if (resultado.sucesso) {

                status.innerHTML =
                    '✅ Arquivo enviado com sucesso!';

                status.style.color =
                    '#188038';


                input.value = '';


                document

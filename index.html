<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Envio de Documentos</title>


    <style>

        /* ==========================================
           CONFIGURAÇÃO GERAL
        =========================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        /* ==========================================
           FUNDO COM DEGRADÊ
        =========================================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

            background:
                linear-gradient(
                    120deg,
                    #102b68 0%,
                    #123f91 30%,
                    #146fc1 65%,
                    #25bfd3 100%
                );

            background-attachment: fixed;

        }


        /* ==========================================
           CONTAINER PRINCIPAL
        =========================================== */

        .container {

            width: 100%;

            max-width: 1000px;

            display: flex;

            flex-direction: row;

            justify-content: center;

            align-items: center;

            gap: 55px;

        }


        /* ==========================================
           LOGO
        =========================================== */

        .logo-area {

            flex: 1;

            max-width: 340px;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .logo-area img {

            display: block;

            max-width: 100%;

            height: auto;

            object-fit: contain;

            padding: 18px;

            background:
                rgba(255, 255, 255, 0.97);

            border:
                1px solid
                rgba(255, 255, 255, 0.90);

            border-radius: 22px;

            box-shadow:
                0 20px 45px
                rgba(0, 0, 0, 0.20);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

        }


        .logo-area img:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 25px 55px
                rgba(0, 0, 0, 0.25);

        }


        /* ==========================================
           CARTÃO
        =========================================== */

        .card {

            width: 100%;

            max-width: 390px;

            padding: 34px;

            background:
                rgba(255, 255, 255, 0.97);

            border-radius: 22px;

            box-shadow:
                0 22px 50px
                rgba(0, 0, 0, 0.20);

            text-align: center;

            position: relative;

            overflow: hidden;

            animation:
                aparecer 0.4s ease;

        }


        /* Linha superior do cartão */

        .card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #102b68,
                    #123f91,
                    #146fc1,
                    #25bfd3
                );

        }


        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(12px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* ==========================================
           TÍTULOS
        =========================================== */

        h2 {

            margin-top: 0;

            margin-bottom: 12px;

            font-size: 23px;

            line-height: 1.25;

            font-weight: 800;

            color: #102b68;

        }


        p {

            color: #667085;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 24px;

        }


        p strong {

            color: #123f91;

        }


        /* ==========================================
           FORMULÁRIOS
        =========================================== */

        .form-group {

            text-align: left;

            margin-bottom: 17px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;

            color: #344054;

        }


        input[type="text"],
        input[type="password"] {

            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #d0d5dd;

            border-radius: 10px;

            background: #ffffff;

            color: #101828;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }


        input[type="text"]:focus,
        input[type="password"]:focus {

            border-color:
                #146fc1;

            box-shadow:
                0 0 0 4px
                rgba(20, 111, 193, 0.12);

        }


        input::placeholder {

            color: #98a2b3;

        }


        /* ==========================================
           CAMPO DE ARQUIVO
        =========================================== */

        input[type="file"] {

            display: block;

            width: 100%;

            margin:
                10px 0 18px;

            padding: 10px;

            border:
                1px dashed #b8c7d9;

            border-radius: 10px;

            background:
                #f8fafc;

            color: #475467;

            font-size: 13px;

            cursor: pointer;

        }


        input[type="file"]:hover {

            border-color:
                #146fc1;

            background:
                #f1f8ff;

        }


        /* ==========================================
           BOTÕES
        =========================================== */

        button {

            width: 100%;

            padding: 13px 16px;

            margin-bottom: 10px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    100deg,
                    #102b68 0%,
                    #123f91 35%,
                    #146fc1 70%,
                    #25bfd3 100%
                );

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 18px
                rgba(18, 63, 145, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 11px 25px
                rgba(18, 63, 145, 0.32);

        }


        button:active {

            transform:
                translateY(0);

        }


        button:disabled {

            background:
                #aab3bf;

            cursor:
                not-allowed;

            box-shadow:
                none;

            transform:
                none;

        }


        /* ==========================================
           BOTÃO SAIR
        =========================================== */

        .btn-logout {

            width: auto;

            margin-top: 18px;

            margin-bottom: 0;

            padding:
                8px 16px;

            background:
                linear-gradient(
                    135deg,
                    #b42318,
                    #d92d20
                );

            font-size: 12px;

            box-shadow:
                0 5px 12px
                rgba(217, 45, 32, 0.20);

        }


        .btn-logout:hover {

            background:
                linear-gradient(
                    135deg,
                    #912018,
                    #b42318
                );

        }


        /* ==========================================
           STATUS
        =========================================== */

        .status-msg {

            min-height: 20px;

            margin-top: 15px;

            font-size: 13px;

            font-weight: 600;

            line-height: 1.5;

        }


        /* ==========================================
           LINKS
        =========================================== */

        .link {

            display: block;

            margin-top: 14px;

            color:
                #0b5cad;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition:
                color 0.2s ease;

        }


        .link:hover {

            color:
                #159db8;

        }


        /* ==========================================
           ELEMENTO OCULTO
        =========================================== */

        .hidden {

            display: none;

        }


        /* ==========================================
           CELULAR / TABLET
        =========================================== */

        @media (max-width: 768px) {

            body {

                padding: 20px;

            }


            .container {

                flex-direction: column;

                gap: 25px;

            }


            .logo-area {

                max-width: 230px;

            }


            .logo-area img {

                padding: 14px;

                border-radius: 18px;

            }


            .card {

                max-width: 420px;

                padding: 28px 22px;

                border-radius: 18px;

            }

        }


        @media (max-width: 480px) {

            body {

                padding: 15px;

            }


            .logo-area {

                max-width: 190px;

            }


            .card {

                padding:
                    27px 18px;

            }


            h2 {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==========================================
         LOGO
    =========================================== -->

    <div class="logo-area">

        <img
            src="https://github.com/ThiagoNegrini/upload_de_arquivos/blob/main/LOGO_SITE.PNG?raw=true"
            alt="Logotipo da Empresa"
            id="imgLogo"
        >

    </div>


    <!-- ==========================================
         LOGIN
    =========================================== -->

    <div
        class="card"
        id="telaLogin"
    >

        <h2>
            ACESSO AO PAINEL DE ENVIO
        </h2>


        <p>
            Entre com seu usuário e senha.
        </p>


        <div class="form-group">

            <label for="loginUsuario">
                Usuário:
            </label>

            <input
                type="text"
                id="loginUsuario"
                placeholder="Digite seu usuário"
            >

        </div>


        <div class="form-group">

            <label for="loginSenha">
                Senha:
            </label>

            <input
                type="password"
                id="loginSenha"
                placeholder="Digite sua senha"
            >

        </div>


        <button
            id="btnLogin"
            onclick="efetuarLogin()"
        >
            Entrar
        </button>


        <div
            id="loginStatus"
            class="status-msg"
        ></div>


        <span
            class="link"
            onclick="mostrarCadastro()"
        >
            Ainda não possui cadastro? Criar conta
        </span>

    </div>


    <!-- ==========================================
         CADASTRO
    =========================================== -->

    <div
        class="card hidden"
        id="telaCadastro"
    >

        <h2>
            CRIAR CADASTRO
        </h2>


        <p>
            Preencha seus dados para criar seu acesso.
        </p>


        <div class="form-group">

            <label for="cadastroNome">
                Nome:
            </label>

            <input
                type="text"
                id="cadastroNome"
                placeholder="Seu nome"
            >

        </div>


        <div class="form-group">

            <label for="cadastroUsuario">
                Usuário:
            </label>

            <input
                type="text"
                id="cadastroUsuario"
                placeholder="Escolha um usuário"
            >

        </div>


        <div class="form-group">

            <label for="cadastroSenha">
                Senha:
            </label>

            <input
                type="password"
                id="cadastroSenha"
                placeholder="Mínimo de 6 caracteres"
            >

        </div>


        <button
            id="btnCadastro"
            onclick="cadastrarUsuario()"
        >
            Criar Cadastro
        </button>


        <div
            id="cadastroStatus"
            class="status-msg"
        ></div>


        <span
            class="link"
            onclick="mostrarLogin()"
        >
            Já possui cadastro? Entrar
        </span>

    </div>


    <!-- ==========================================
         UPLOAD
    =========================================== -->

    <div
        class="card hidden"
        id="telaUpload"
    >

        <h2>
            SISTEMA DE ENVIO
        </h2>


        <p>

            Olá,
            <strong id="nomeUsuarioLogado"></strong>!

            <br>

            DOCUMENTAÇÃO CARNAVAL 2027

        </p>


        <!-- NOME DA PASTA -->

        <div class="form-group">

            <label for="nomePasta">
                Nome da Pasta:
            </label>

            <input
                type="text"
                id="nomePasta"
                placeholder="Ex: Escola de Samba Unidos"
            >

        </div>


        <!-- NOME DO ARQUIVO -->

        <div class="form-group">

            <label for="nomeArquivoCustom">
                Nome do Arquivo / Identificação:
            </label>

            <input
                type="text"
                id="nomeArquivoCustom"
                placeholder="Ex: Escola_Samba_Oficio_01"
            >

        </div>


        <!-- ARQUIVO -->

        <input
            type="file"
            id="arquivoInput"
        >


        <!-- ENVIAR -->

        <button
            id="btnEnviar"
            onclick="enviarArquivo()"
        >
            Enviar Arquivo
        </button>


        <div
            id="status"
            class="status-msg"
        ></div>


        <!-- SAIR -->

        <button
            class="btn-logout"
            onclick="efetuarLogout()"
        >
            Sair da Conta
        </button>

    </div>

</div>


<script>


// ==========================================
// CONFIGURAÇÃO
// ==========================================

const URL_SCRIPT =
    'https://script.google.com/macros/s/AKfycby5efH0Y0qUlrPVpaiCgAlryk69XadO8csPJCL0um84YKwzueQ2wG2w93i6IvOPc5SjoQ/exec';


let usuarioLogado = '';


// ==========================================
// MOSTRAR LOGIN
// ==========================================

function mostrarLogin() {

    document
        .getElementById('telaCadastro')
        .classList.add('hidden');

    document
        .getElementById('telaUpload')
        .classList.add('hidden');

    document
        .getElementById('telaLogin')
        .classList.remove('hidden');

}


// ==========================================
// MOSTRAR CADASTRO
// ==========================================

function mostrarCadastro() {

    document
        .getElementById('telaLogin')
        .classList.add('hidden');

    document
        .getElementById('telaUpload')
        .classList.add('hidden');

    document
        .getElementById('telaCadastro')
        .classList.remove('hidden');

}


// ==========================================
// CADASTRO
// ==========================================

async function cadastrarUsuario() {

    const nome =
        document
            .getElementById('cadastroNome')
            .value
            .trim();


    const usuario =
        document
            .getElementById('cadastroUsuario')
            .value
            .trim();


    const senha =
        document
            .getElementById('cadastroSenha')
            .value
            .trim();


    const status =
        document.getElementById(
            'cadastroStatus'
        );


    const botao =
        document.getElementById(
            'btnCadastro'
        );


    if (!nome || !usuario || !senha) {

        status.innerHTML =
            '⚠️ Preencha todos os campos.';

        status.style.color =
            '#d93025';

        return;

    }


    if (senha.length < 6) {

        status.innerHTML =
            '⚠️ A senha deve possuir pelo menos 6 caracteres.';

        status.style.color =
            '#d93025';

        return;

    }


    botao.disabled = true;

    status.innerHTML =
        '⏳ Criando cadastro...';

    status.style.color =
        '#146fc1';


    try {

        const parametros =
            new URLSearchParams({

                acao: 'cadastro',

                nome: nome,

                usuario: usuario,

                senha: senha

            });


        const resposta =
            await fetch(

                URL_SCRIPT,

                {
                    method: 'POST',
                    mode: 'cors',
                    body: parametros
                }

            );


        const resultado =
            await resposta.json();


        if (resultado.sucesso) {

            status.innerHTML =
                '✅ Cadastro realizado com sucesso!';

            status.style.color =
                '#188038';


            document
                .getElementById(
                    'cadastroNome'
                )
                .value = '';


            document
                .getElementById(
                    'cadastroUsuario'
                )
                .value = '';


            document
                .getElementById(
                    'cadastroSenha'
                )
                .value = '';


            setTimeout(
                mostrarLogin,
                1500
            );

        } else {

            status.innerHTML =
                '❌ ' +
                resultado.mensagem;

            status.style.color =
                '#d93025';

        }


    } catch (erro) {

        console.error(erro);

        status.innerHTML =
            '❌ Erro de comunicação com o servidor.';

        status.style.color =
            '#d93025';

    } finally {

        botao.disabled = false;

    }

}


// ==========================================
// LOGIN
// ==========================================

async function efetuarLogin() {

    const usuario =
        document
            .getElementById(
                'loginUsuario'
            )
            .value
            .trim();


    const senha =
        document
            .getElementById(
                'loginSenha'
            )
            .value
            .trim();


    const status =
        document.getElementById(
            'loginStatus'
        );


    const botao =
        document.getElementById(
            'btnLogin'
        );


    if (!usuario || !senha) {

        status.innerHTML =
            '⚠️ Informe usuário e senha.';

        status.style.color =
            '#d93025';

        return;

    }


    botao.disabled = true;

    status.innerHTML =
        '⏳ Verificando acesso...';

    status.style.color =
        '#146fc1';


    try {

        const parametros =
            new URLSearchParams({

                acao: 'login',

                usuario: usuario,

                senha: senha

            });


        const resposta =
            await fetch(

                URL_SCRIPT,

                {
                    method: 'POST',
                    mode: 'cors',
                    body: parametros
                }

            );


        const resultado =
            await resposta.json();


        if (resultado.sucesso) {

            usuarioLogado =
                resultado.usuario;


            document
                .getElementById(
                    'nomeUsuarioLogado'
                )
                .innerText =
                resultado.nome ||
                resultado.usuario;


            document
                .getElementById(
                    'telaLogin'
                )
                .classList.add('hidden');


            document
                .getElementById(
                    'telaUpload'
                )
                .classList.remove('hidden');


            document
                .getElementById(
                    'loginUsuario'
                )
                .value = '';


            document
                .getElementById(
                    'loginSenha'
                )
                .value = '';


            status.innerHTML = '';

        } else {

            status.innerHTML =
                '❌ ' +
                resultado.mensagem;

            status.style.color =
                '#d93025';

        }


    } catch (erro) {

        console.error(erro);

        status.innerHTML =
            '❌ Erro de comunicação com o servidor.';

        status.style.color =
            '#d93025';

    } finally {

        botao.disabled = false;

    }

}


// ==========================================
// LOGOUT
// ==========================================

function efetuarLogout() {

    usuarioLogado = '';


    document
        .getElementById(
            'telaUpload'
        )
        .classList.add('hidden');


    document
        .getElementById(
            'telaLogin'
        )
        .classList.remove('hidden');


    document
        .getElementById(
            'status'
        )
        .innerHTML = '';


    document
        .getElementById(
            'arquivoInput'
        )
        .value = '';


    document
        .getElementById(
            'nomePasta'
        )
        .value = '';


    document
        .getElementById(
            'nomeArquivoCustom'
        )
        .value = '';

}


// ==========================================
// UPLOAD
// ==========================================

function enviarArquivo() {

    const input =
        document.getElementById(
            'arquivoInput'
        );


    const status =
        document.getElementById(
            'status'
        );


    const botao =
        document.getElementById(
            'btnEnviar'
        );


    const nomePastaInput =
        document
            .getElementById(
                'nomePasta'
            )
            .value
            .trim();


    const nomeCustomInput =
        document
            .getElementById(
                'nomeArquivoCustom'
            )
            .value
            .trim();


    if (!usuarioLogado) {

        status.innerHTML =
            '❌ Sessão expirada. Faça login novamente.';

        status.style.color =
            '#d93025';

        return;

    }


    if (!nomePastaInput) {

        status.innerHTML =
            '⚠️ Informe o nome da pasta.';

        status.style.color =
            '#d93025';

        document
            .getElementById(
                'nomePasta'
            )
            .focus();

        return;

    }


    if (input.files.length === 0) {

        status.innerHTML =
            '⚠️ Por favor, selecione um arquivo primeiro.';

        status.style.color =
            '#d93025';

        return;

    }


    const arquivo =
        input.files[0];


    botao.disabled = true;


    status.innerHTML =
        '⏳ Enviando arquivo, por favor aguarde...';

    status.style.color =
        '#146fc1';


    const leitor =
        new FileReader();


    leitor.readAsDataURL(
        arquivo
    );


    leitor.onload =
        async function() {

            try {

                const dadosBase64 =
                    leitor
                        .result
                        .split(',')[1];


                let nomeFinalArquivo =
                    arquivo.name;


                if (
                    nomeCustomInput !== ''
                ) {

                    const partes =
                        arquivo.name
                            .split('.');


                    const ext =
                        partes.length > 1
                            ? partes.pop()
                            : '';


                    nomeFinalArquivo =
                        nomeCustomInput +
                        (
                            ext
                                ? '.' + ext
                                : ''
                        );

                }


                const parametros =
                    new URLSearchParams({

                        acao: 'upload',

                        usuario:
                            usuarioLogado,

                        pasta:
                            nomePastaInput,

                        data:
                            dadosBase64,

                        mimeType:
                            arquivo.type,

                        filename:
                            nomeFinalArquivo

                    });


                const resposta =
                    await fetch(

                        URL_SCRIPT,

                        {
                            method: 'POST',
                            mode: 'cors',
                            body: parametros
                        }

                    );


                const resultado =
                    await resposta.json();


                if (resultado.sucesso) {

                    status.innerHTML =
                        '✅ Arquivo enviado com sucesso!';

                    status.style.color =
                        '#188038';


                    input.value = '';


                    document
                        .getElementById(
                            'nomeArquivoCustom'
                        )
                        .value = '';

                } else {

                    status.innerHTML =
                        '❌ ' +
                        resultado.mensagem;

                    status.style.color =
                        '#d93025';

                }


            } catch (erro) {

                console.error(erro);

                status.innerHTML =
                    '❌ Erro ao enviar o arquivo.';

                status.style.color =
                    '#d93025';

            } finally {

                botao.disabled = false;

            }

        };

}

</script>


</body>

</html>
